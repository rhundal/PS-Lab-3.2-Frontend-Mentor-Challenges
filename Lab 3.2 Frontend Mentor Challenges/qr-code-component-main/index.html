<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="./styles/style.css" />

</head>

<body>

  <main id="main_container">
    <section id="outer_container">
      <section id="imageArea">
        <img src="./images/image-qr-code.png" alt="qr code." class="qr_img_style" />
      </section>
      <div id="bolded_text">
        Improve your front-end <br />skills by building projects
      </div>
      <section id="unbolded_text">
        <p>
          Scan the QR code to visit Frontend Mentor <br /> and take your coding skills to <br />the next level
        </p>
      </section>
    </section>

  </main>

  <footer class="footer_container">
    <p> Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend
        Mentor</a>.
      <br /> Coded by <a href="#">Rajdeep H</a>.
    </p>
  </footer>

</body>

</html>
